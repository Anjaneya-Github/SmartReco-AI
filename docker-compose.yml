version: "3.9"

services:

  postgres:
    image: postgres:16
    container_name: smartreco-postgres

    environment:
      POSTGRES_DB: smartreco
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  qdrant:
    image: qdrant/qdrant
    container_name: smartreco-qdrant

    ports:
      - "6333:6333"

    volumes:
      - qdrant_data:/qdrant/storage

volumes:

  postgres_data:

  qdrant_data: