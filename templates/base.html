<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>{% block title %}SmartReco AI{% endblock %}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
  <style>
    :root { --sr-accent: #0d6efd; --sr-card-bg: #1e1e2e; }
    body { background: #12121f; font-family: 'Segoe UI', sans-serif; }
    .navbar-brand { font-weight: 700; letter-spacing: .5px; }
    .card { background: var(--sr-card-bg); border: 1px solid #2a2a3e; }
    .confidence-badge { font-size: .75rem; padding: .25em .6em; }
    .sidebar { min-height: calc(100vh - 56px); background: #16162a; border-right: 1px solid #2a2a3e; }
    .nav-link.active { background: rgba(13,110,253,.15); border-radius: 6px; }
    .stat-card { border-left: 3px solid var(--sr-accent); }
    .timeline-dot { width:10px; height:10px; border-radius:50%; background:var(--sr-accent); flex-shrink:0; }
    #toast-container { position:fixed; bottom:1rem; right:1rem; z-index:9999; }
  </style>
  {% block extra_head %}{% endblock %}
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark border-bottom border-secondary">
  <div class="container-fluid px-4">
    <a class="navbar-brand" href="/dashboard"><i class="bi bi-cpu-fill text-primary me-2"></i>SmartReco AI</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navMenu">
      <ul class="navbar-nav me-auto">
        <li class="nav-item"><a class="nav-link" href="/dashboard"><i class="bi bi-speedometer2 me-1"></i>Dashboard</a></li>
        <li class="nav-item"><a class="nav-link" href="/products"><i class="bi bi-grid me-1"></i>Courses</a></li>
      </ul>
      <div class="d-flex align-items-center gap-3" id="nav-user-area">
        <span class="text-muted small" id="nav-user-email"></span>
        <a href="#" class="btn btn-outline-secondary btn-sm" id="nav-logout-btn" onclick="logout()">
          <i class="bi bi-box-arrow-right me-1"></i>Logout
        </a>
      </div>
    </div>
  </div>
</nav>
<div id="toast-container"></div>
{% block content %}{% endblock %}
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
  // Don't load tracker or auth fetch on the login page
  const _isLoginPage = window.location.pathname === '/login';
</script>
{% if request.url.path != '/login' %}
<script src="/static/js/tracker.js"></script>
{% endif %}
<script>
  function getToken(){ return localStorage.getItem('access_token'); }
  function logout(){ localStorage.removeItem('access_token'); window.location.replace('/login'); }
  function showToast(msg, type='success'){
    const t = document.getElementById('toast-container');
    const id = 'toast-'+Date.now();
    t.innerHTML += `<div id="${id}" class="toast align-items-center text-bg-${type} border-0 show mb-2" role="alert">
      <div class="d-flex"><div class="toast-body">${msg}</div>
      <button type="button" class="btn-close btn-close-white me-2 m-auto" onclick="document.getElementById('${id}').remove()"></button></div></div>`;
    setTimeout(()=>{ const el=document.getElementById(id); if(el) el.remove(); }, 4000);
  }
  // Populate nav user email (skip on login page to avoid flicker)
  if(!_isLoginPage){
    const _tok = getToken();
    if(_tok){
      fetch('/api/v1/auth/me',{headers:{'Authorization':'Bearer '+_tok}})
        .then(r=>{ if(!r.ok){ localStorage.removeItem('access_token'); return null; } return r.json(); })
        .then(u=>{ if(u){ const el=document.getElementById('nav-user-email'); if(el) el.textContent=u.email||''; } });
    }
  }
</script>
{% block extra_scripts %}{% endblock %}
</body>
</html>
