{% extends "base.html" %}
{% block title %}Courses — SmartReco AI{% endblock %}
{% block content %}
<div class="container py-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h4 class="fw-bold mb-0"><i class="bi bi-grid me-2 text-primary"></i>Course Catalogue</h4>
    <div class="input-group" style="max-width:300px">
      <input type="text" id="search-input" class="form-control" placeholder="Search courses…"/>
      <button class="btn btn-outline-primary" onclick="searchProducts()"><i class="bi bi-search"></i></button>
    </div>
  </div>
  <div id="filter-bar" class="d-flex flex-wrap gap-2 mb-4">
    <button class="btn btn-sm btn-outline-secondary active" onclick="filterCat('')">All</button>
  </div>
  <div class="row g-3" id="products-grid">
    <div class="col-12 text-center py-5"><div class="spinner-border text-primary"></div></div>
  </div>
  <nav class="mt-4 d-flex justify-content-center" id="pagination"></nav>
</div>
{% endblock %}
{% block extra_scripts %}
<script>
const API = '/api/v1';
let currentPage = 1, currentSearch = '', currentCat = '';

async function loadProducts(page=1){
  currentPage = page;
  const token = localStorage.getItem('access_token');
  const r = await fetch(`${API}/products?page=${page}&page_size=12`, {
    headers: token ? {'Authorization':'Bearer '+token} : {}
  });
  const d = await r.json();
  renderProducts(d.items || []);
  renderPagination(d.page, d.pages);
  if(window._tracker) window._tracker.track('view', null, {page: 'products'});
}

function renderProducts(items){
  const g = document.getElementById('products-grid');
  if(!items.length){ g.innerHTML='<div class="col-12 text-muted text-center py-5">No courses found.</div>'; return; }
  g.innerHTML = items.map(p=>`
    <div class="col-md-6 col-lg-4">
      <div class="card h-100 product-card" onclick="viewProduct('${p.id}')" style="cursor:pointer">
        <div class="card-body">
          <h6 class="fw-semibold mb-1">${p.title}</h6>
          <div class="d-flex gap-1 flex-wrap mb-2">
            ${p.category ? `<span class="badge bg-primary bg-opacity-25 text-primary">${p.category}</span>` : ''}
            ${p.difficulty ? `<span class="badge bg-secondary">${p.difficulty}</span>` : ''}
            ${p.price === null || p.price === 0 ? '<span class="badge bg-success">Free</span>' : `<span class="badge bg-info">$${p.price}</span>`}
          </div>
          <p class="text-muted small mb-2" style="display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden">
            ${p.description || 'No description available.'}
          </p>
          <div class="d-flex flex-wrap gap-1">
            ${(p.tags||[]).slice(0,3).map(t=>`<span class="badge bg-dark text-secondary border">${t}</span>`).join('')}
          </div>
        </div>
        <div class="card-footer text-muted small d-flex justify-content-between">
          <span>${p.duration ? p.duration+' min' : ''}</span>
          <span><i class="bi bi-arrow-right-circle text-primary"></i></span>
        </div>
      </div>
    </div>`).join('');
}

function renderPagination(page, pages){
  const p = document.getElementById('pagination');
  if(pages <= 1){ p.innerHTML=''; return; }
  let html = '<ul class="pagination pagination-sm">';
  for(let i=1;i<=pages;i++)
    html+=`<li class="page-item ${i===page?'active':''}"><a class="page-link" href="#" onclick="loadProducts(${i})">${i}</a></li>`;
  p.innerHTML = html + '</ul>';
}

function viewProduct(id){
  if(window._tracker) window._tracker.track('click', id);
  window.location = '/products/'+id;
}

function searchProducts(){
  const q = document.getElementById('search-input').value.trim();
  if(q && window._tracker) window._tracker.track('search', null, {query:q});
  loadProducts(1);
}

document.getElementById('search-input').addEventListener('keydown', e=>{ if(e.key==='Enter') searchProducts(); });
loadProducts();
</script>
{% endblock %}
